# =============================================================================
# meta-gallery 운영계(prod) nginx 사이트 설정
#   설치 위치 : /etc/nginx/sites-available/meta-gallery-prod.conf
#   활성화    : ln -s ../sites-available/meta-gallery-prod.conf /etc/nginx/sites-enabled/
#   호스트명  : metagallery.duckdns.org   (계획서 1-2 고정값)
#   정적 루트 : /srv/meta-gallery/prod/current
#   백엔드    : 127.0.0.1:3000 (루프백 전용, 아직 코드 없음 → 미기동 시 /api/ 만 502)
#
# 2단계 구성(인증서가 없는 상태에서도 80 포트로 먼저 떠야 하므로):
#   STAGE 1 = [A] 블록만 활성 (HTTP로 사이트 제공 + HTTP-01 챌린지 응답)
#   STAGE 2 = 인증서 발급 후 [A]를 주석 처리하고 [B](443)·[C](80→443) 주석 해제
#   자세한 순서는 docs/infra/server-layout.md "HTTPS 전환 순서" 참고.
# =============================================================================

# -----------------------------------------------------------------------------
# [A] STAGE 1 : HTTP 전용 (인증서 발급 전. 발급 후 이 블록 전체를 주석 처리)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name metagallery.duckdns.org;

    # certbot HTTP-01 webroot. STAGE 2 이후에도 갱신에 필요하므로 [C]에 유지한다.
    # auth_basic off 는 운영계에 지금 Basic 인증이 없어도 둔다. 나중에 운영계에 인증을
    # 걸었을 때 인증서 발급·갱신이 조용히 깨지는 것을 막기 위한 것이고, dev 설정과
    # 블록 모양을 맞추는 의미도 있다. 이 예외의 적정성은 정보보호팀 검토 대상이다.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /srv/meta-gallery/prod/current;
    # 릴리스 디렉터리의 진입 파일명. scripts/deploy/remote-release.sh(팀원1)가
    # 어떤 이름으로 올리는지에 맞춰야 한다 → docs/infra/server-layout.md 미확인 항목 참고.
    index index.html meta-gallery.html;

    access_log /var/log/nginx/meta-gallery-prod.access.log;
    error_log  /var/log/nginx/meta-gallery-prod.error.log warn;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP는 three.js r128을 cdnjs에서 불러오므로 cdnjs 허용이 필요하다.
    # 적용 전 정보보호본부 애플리케이션보안팀 검토 대상(계획서 3-2).
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 헬스체크: nginx가 직접 200을 반환한다(백엔드 유무와 무관). 배포 검증이 이 경로를 쓴다.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML은 캐시하지 않는다(심볼릭 링크 교체 직후 구버전이 남지 않게).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # WebSocket(실시간 채팅)으로 가면 아래 두 줄이 필요하다. $connection_upgrade map은
        # sites-available에 두면 prod/dev 양쪽에서 중복 정의되므로 http 컨텍스트
        # (/etc/nginx/conf.d/websocket-upgrade.conf)에 한 번만 둔다. 백엔드팀 확정 대기.
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}

