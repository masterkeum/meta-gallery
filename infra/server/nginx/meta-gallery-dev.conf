# =============================================================================
# meta-gallery 개발계(dev) nginx 사이트 설정
#   설치 위치 : /etc/nginx/sites-available/meta-gallery-dev.conf
#   활성화    : ln -s ../sites-available/meta-gallery-dev.conf /etc/nginx/sites-enabled/
#   호스트명  : metagallery-dev.duckdns.org   (계획서 1-2 고정값)
#   정적 루트 : /srv/meta-gallery/dev/current
#   백엔드    : 127.0.0.1:3001 (루프백 전용, 아직 코드 없음 → 미기동 시 /api/ 만 502)
#
# 개발계 접근 제한(계획서 1-2):
#   - HTTP Basic 인증 : /etc/nginx/.htpasswd-meta-gallery-dev (provision.sh가 생성)
#   - 검색 비노출     : X-Robots-Tag: noindex, nofollow + /robots.txt Disallow
#   ※ Basic 인증은 HTTP 구간에서 자격증명이 평문으로 흐른다. STAGE 2(HTTPS) 전환 전까지는
#     임시 수단이며, 이 수준으로 충분한지는 정보보호본부 애플리케이션보안팀 검토 대상(계획서 3-2).
#
# 2단계 구성은 prod와 동일하다. STAGE 1 = [A], STAGE 2 = [B]+[C].
#   자세한 순서는 docs/infra/server-layout.md "HTTPS 전환 순서" 참고.
# =============================================================================

# -----------------------------------------------------------------------------
# [A] STAGE 1 : HTTP 전용 (인증서 발급 전. 발급 후 이 블록 전체를 주석 처리)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name metagallery-dev.duckdns.org;

    # certbot HTTP-01 webroot. Basic 인증을 반드시 해제해야 챌린지가 통과한다.
    # (정보보호팀 검토 대상: Basic 인증 예외 경로)
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    root /srv/meta-gallery/dev/current;
    index index.html meta-gallery.html;

    access_log /var/log/nginx/meta-gallery-dev.access.log;
    error_log  /var/log/nginx/meta-gallery-dev.error.log warn;

    server_tokens off;
    client_max_body_size 2m;

    auth_basic           "meta-gallery dev";
    auth_basic_user_file /etc/nginx/.htpasswd-meta-gallery-dev;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 헬스체크: 배포 파이프라인(scripts/deploy)이 인증 없이 호출하므로 Basic 인증을 해제한다.
    # 내용이 고정 문자열 "ok"뿐이라 노출 정보는 없다.
    # (정보보호팀 검토 대상: Basic 인증 예외 경로)
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 크롤러가 Basic 인증 전에 robots.txt를 읽을 수 있게 열어 둔다.
    location = /robots.txt {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---- 공유 미디어 (/media/) ----------------------------------------------
    # 1층 로비 사이니지 영상·포스터 등 릴리스와 수명이 다른 정적 파일.
    # 릴리스 디렉터리 밖의 shared/media 를 가리켜, 배포(current 심링크 교체)마다
    # 다시 올리지 않아도 된다. remote-release.sh 는 shared/ 를 지우지 않는다.
    # location 끝 슬래시와 alias 끝 슬래시는 쌍이다. 한쪽만 지우면 경로가 어긋난다.
    location ^~ /media/ {
        alias /srv/meta-gallery/dev/shared/media/;

        # 파일명에 버전 해시가 없으므로 immutable 영구 캐시는 쓰지 않는다.
        # 7일 동안 캐시하고 그 뒤 ETag/Last-Modified 로 재검증한다.
        # 영상 교체 시 최대 7일 지연을 감수하는 값이며, 급히 바꿔야 하면
        # 파일명을 바꿔 올리고 참조를 함께 고친다.
        add_header Cache-Control "public, max-age=604800" always;
        # add_header 가 있는 location 은 server 레벨 add_header 를 물려받지 못한다.
        # 그래서 보안 헤더를 여기서 다시 선언한다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # three.js VideoTexture 는 영상을 WebGL 텍스처로 올리므로 영상이 페이지와
        # 다른 출처면 CORS 가 필요하다. 개발계는 비공개 유지가 원칙이라
        # Access-Control-Allow-Origin 을 열지 않는다. 개발계 페이지는 같은 출처
        # 상대경로(/media/signage.mp4)를 쓴다 - 프론트엔드팀 확인 필요.

        # Basic 인증은 server 레벨에서 상속된다. 개발계는 비공개 유지가 원칙이고,
        # 같은 출처 하위 리소스에는 브라우저가 저장된 자격증명을 함께 보내므로
        # 페이지 인증 후 영상도 재생된다. auth_basic off 를 넣지 않는다.

        # Range 요청(영상 탐색)은 nginx 정적 파일 처리의 기본 동작이다
        # (Accept-Ranges: bytes, 부분 응답 206). 단 gzip 이 걸리면 Range 가
        # 깨지므로 미디어는 압축하지 않는다. mp4·jpg 는 이미 압축 포맷이다.
        gzip off;

        # access_log 는 끄지 않는다. 월 전송량 1TB 한도 감시에 필요하다.
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        # WebSocket 전환 시 필요. $connection_upgrade map은 http 컨텍스트
        # (/etc/nginx/conf.d/websocket-upgrade.conf)에 한 번만 정의한다. 백엔드팀 확정 대기.
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location ~ /\.(?!well-known) { deny all; }
}

